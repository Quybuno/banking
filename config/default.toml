# Cấu hình mặc định của N06.
# Không lưu password hoặc secret_key tại đây; mọi credential phải lấy từ biến môi trường.

profile = "default"
business_timezone = "Asia/Ho_Chi_Minh"

[services]
airflow_enabled = true
metabase_enabled = true

[kafka]
bootstrap_servers = "kafka:9092"
events_topic = "n06.banking.events.v1"
num_partitions = 3
replication_factor = 1
consumer_group = "n06-streaming-raw-bronze"
max_offsets_per_trigger = 50000
trigger_interval_seconds = 5

[object_store]
endpoint = "http://minio:9000"
region = "us-east-1"
bucket = "n06-lakehouse"
path_style_access = true

[postgres.mart]
host = "postgres"
port = 5432
database = "n06_mart"
user = "n06_mart_user"

[postgres.control]
host = "postgres"
port = 5432
database = "n06_control"
user = "n06_control_user"

[postgres.airflow]
host = "postgres"
port = 5432
database = "n06_airflow"
user = "n06_airflow_user"

[postgres.metabase]
host = "postgres"
port = 5432
database = "n06_metabase"
user = "n06_metabase_user"

[spark]
app_name = "n06-pipeline"
master = "local[2]"
shuffle_partitions = 50
cores = 2
driver_memory = "2g"
executor_memory = "2g"
aqe_enabled = true
target_file_size_mb = 64
event_log_enabled = true
event_log_dir = "data/spark-events"

[producer]
rate = 0
key_strategy = "transaction_id"
acks = "all"
retries = 5
batch_size = 16384

[dataset]
dataset_id = "n06-demo-clean"
seed = 42
from_date = "2026-01-01"
to_date = "2026-01-03"
transaction_count = 10000
account_count = 100
currency = "VND"
allowed_lateness_seconds = 86400

[paths]
raw_prefix = "raw"
bronze_prefix = "bronze"
silver_prefix = "silver"
gold_prefix = "gold"
quarantine_prefix = "quarantine"
statements_prefix = "statements"
checkpoints_prefix = "checkpoints"
benchmark_prefix = "benchmark"
generator_output_dir = "data/generated"
reports_dir = "reports"


[limits]
# Giới hạn theo dung lượng máy (CFG-scale-guard). GB = 10^9 byte, KB = 10^3 byte.
# Chỉ thêm khóa mới; không đổi mức quy mô của đặc tả (dataset.transaction_count và profile).
#
# Chỗ trống tối thiểu phải còn lại sau khi ghi (dự trữ). Giá trị chọn cho máy phát triển này,
# nơi đĩa ảo WSL và Docker cùng nằm trên một ổ Windows nhỏ; đặt lại theo máy bằng
# N06__LIMITS__MIN_FREE_DISK_GB_RESERVE.
min_free_disk_gb_reserve = 8
# Số byte generator ghi cho mỗi giao dịch (source + ground truth). Số ĐO THẬT: 3980,0 B/giao
# dịch ở 20.000 và 3992,8 B/giao dịch ở 100.000 giao dịch (làm tròn lên 4000). Nguồn và cách
# tái hiện: docs/measurements/generator-bytes-per-tx.md.
generator_bytes_per_tx = 4000
# Không đặt các khóa sau thì nhận giá trị None:
#   max_transactions      trần số giao dịch cho máy này (không đặt = không giới hạn thêm);
#                         đặt qua N06__LIMITS__MAX_TRANSACTIONS.
#   pipeline_bytes_per_tx số byte Kafka, MinIO và Postgres tốn cho mỗi giao dịch. CHƯA ĐO nên
#                         không đặt; khi chưa đặt, kiểm tra dung lượng chỉ cảnh báo, không PASS đủ.
#   disk_probe_path       thư mục trên ổ Windows chứa đĩa ảo WSL (ví dụ /mnt/d); không đặt thì
#                         tự xác định qua registry của WSL, không xác định được thì từ chối chạy.
