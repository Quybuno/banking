# Profile benchmark: tắt Airflow và Metabase để tiết kiệm RAM khi đo hiệu năng (đặc tả Phần I mục 2, 14).

profile = "benchmark"

[object_store]
# ADR-0002 mục 5: pipeline đầy đủ khi đo (E1-E3, E5) dùng bucket riêng để Raw/Bronze/Silver/Gold
# của lần đo không lẫn dữ liệu nghiệp vụ. Endpoint giữ nguyên theo default.toml.
bucket = "n06-benchmark-lakehouse"

[services]
airflow_enabled = false
metabase_enabled = false

[kafka]
num_partitions = 6
max_offsets_per_trigger = 100000

[spark]
master = "local[4]"
shuffle_partitions = 50
cores = 4
driver_memory = "4g"
executor_memory = "4g"
aqe_enabled = true

[producer]
rate = 0
key_strategy = "transaction_id"

[dataset]
dataset_id = "n06-benchmark"
seed = 42
from_date = "2026-01-01"
to_date = "2026-01-03"
transaction_count = 1000000
account_count = 10000
currency = "VND"
allowed_lateness_seconds = 86400

